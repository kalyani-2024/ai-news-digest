[project]
name = "ai-news-aggregator"
version = "0.1.0"
description = "Daily AI news digest: scrapes sources, summarizes with LLMs, ranks against your profile, and emails the result"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.2",
    "feedparser>=6.0.12",
    "google-genai>=2.24.0",
    "html-to-markdown>=3.14.3",
    "langchain-core>=1.6.4",
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.12",
    "markdown>=3.7.0",
    "markdownify>=0.11.6",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.44",
    "youtube-transcript-api>=1.2.3",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
